# Render Blueprint for the CSI Tamil Parish Dubai Jobs Board.
# One web service that builds the React frontend and serves it together with
# the Express API. The database is your existing Neon Postgres, supplied via
# the DATABASE_URL environment variable (set it in the Render dashboard).
services:
  - type: web
    name: csi-jobs-board
    runtime: node
    plan: free
    # --include=dev is required because NODE_ENV=production would otherwise skip
    # the build tools (Vite, Tailwind) that live in devDependencies.
    # Install frontend deps + build the static site into /dist, then install
    # the server deps.
    buildCommand: npm install --include=dev && npm run build && npm install --prefix server
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set this in the Render dashboard (do not commit it)
